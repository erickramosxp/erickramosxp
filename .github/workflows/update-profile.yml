name: Update Galaxy Profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone galaxy-profile generator
        run: git clone https://github.com/vinimlo/galaxy-profile /tmp/galaxy

      - name: Install dependencies
        run: pip install -r /tmp/galaxy/requirements.txt

      - name: Copy config
        run: cp config.yml /tmp/galaxy/config.yml

      - name: Generate SVGs
        run: |
          cd /tmp/galaxy
          python -m generator.main

      - name: Copy generated assets
        run: |
          mkdir -p assets/generated
          cp /tmp/galaxy/assets/generated/*.svg assets/generated/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile SVGs [skip ci]"
            git push
          fi
